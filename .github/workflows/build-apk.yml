name: Build Goias RolePlay Godot APK

on:
  workflow_dispatch:
  push:
    paths:
      - "game3d/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.10.2.4988404 ndk;28.1.13356709"

      - name: Instalar Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false

      - name: Instalar templates Android
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.1.stable"

          rm -rf "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_DIR"

          wget -O /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz"

          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates

          unzip -q /tmp/templates.tpz -d /tmp/godot-templates

          echo "Templates encontrados:"
          find /tmp/godot-templates -type f

          find /tmp/godot-templates -type f \
            \( -name "android_debug.apk" \
            -o -name "android_release.apk" \
            -o -name "android_source.zip" \) \
            -exec cp {} "$TEMPLATE_DIR/" \;

          echo "4.5.1.stable" > "$TEMPLATE_DIR/version.txt"

          echo "Templates instalados:"
          ls -lah "$TEMPLATE_DIR"

      - name: Diagnosticar ambiente
        run: |
          echo "===== GODOT ====="
          godot --version

          echo "===== JAVA ====="
          java -version

          echo "===== ANDROID ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          adb version

          echo "===== TEMPLATES ====="
          ls -lah "$HOME/.local/share/godot/export_templates/4.5.1.stable/"

          echo "===== VERSION ====="
          cat "$HOME/.local/share/godot/export_templates/4.5.1.stable/version.txt"

      - name: Criar saída
        run: |
          mkdir -p game3d/build

           - name: Validar preset Android
        run: |
          cd game3d

          echo "===== ARQUIVOS ====="
          ls -lah

          echo "===== PRESET ====="
          cat export_presets.cfg

          echo "===== PROJETO ====="
          cat project.godot

          echo "===== EXPORT PRESETS ====="
          godot --headless --path . --editor --quit --verbose

          echo "===== EXPORT ====="
          mkdir -p build

          godot --headless \
            --path . \
            --editor \
            --export-debug "Android" \
            build/goias-roleplay.apk

      - name: Verificar APK
        run: |
          ls -lh game3d/build/goias-roleplay.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GoiasRP-Godot-APK
          path: game3d/build/goias-roleplay.apk
