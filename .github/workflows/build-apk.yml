name: Build Goias RolePlay Godot APK

on:
  workflow_dispatch:
  push:
    paths:
      - "game3d/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 cmdline-tools;latest cmake;3.10.2.4988404 ndk;28.1.13356709"
      - name: Instalar Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false

      - name: Instalar templates Android
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.1.stable"
          echo "4.5.1.stable" > "$TEMPLATE_DIR/version.txt"

          wget -O /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz"

          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates

          unzip -q /tmp/templates.tpz -d /tmp/godot-templates

          echo "Templates encontrados:"
          find /tmp/godot-templates -type f

          find /tmp/godot-templates -type f \
            \( -name "android_debug.apk" \
            -o -name "android_release.apk" \
            -o -name "android_source.zip" \) \
            -exec cp {} "$TEMPLATE_DIR/" \;

          echo "Templates instalados:"
          ls -lh "$TEMPLATE_DIR"

      - name: Configurar caminhos Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          adb version
          java -version
          godot --version

      - name: Verificar templates
        run: |
          ls -lh "$HOME/.local/share/godot/export_templates/4.5.1.stable/"

      - name: Criar saída
        run: |
          mkdir -p game3d/build

      - name: Exportar APK
        run: |
          godot --headless \
            --path game3d \
            --export-debug "Android" \
            build/goias-roleplay.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GoiasRP-Godot-APK
          path: game3d/build/goias-roleplay.apk
